# Builds a release of the version in pyproject.toml and publishes it on GitHub, with the SHA-256 of every file, and
# on PyPI, so install commands can name an exact release instead of whatever main holds that minute (INT-06).
#
# Release either way (CHANGELOG.md must have an entry for the version):
#   * Actions -> Release -> Run workflow -> branch main, tick "Publish": creates tag v<version> on main.
#     Without the tick it only tests and builds (a dry run).
#   * git tag v0.2.0 && git push origin v0.2.0
#
# Nothing is published without you: the GitHub release waits in the `release` environment (you as required
# reviewer), then the PyPI upload runs in the `pypi` environment through PyPI trusted publishing, so no PyPI token
# is stored anywhere. Set both up first (docs/REPO_SETTINGS.md). If PyPI isn't set up yet, the GitHub release still
# goes out and only the pypi job fails; set PyPI up and use "Re-run failed jobs".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in pyproject.toml (creates tag v<version> on main)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the version, the tag and the changelog
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $v"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          elif [ "$PUBLISH" = "true" ]; then
            test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::publish only from main"; exit 1; }
            if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$v" >/dev/null; then
              echo "::error::v$v is already released; raise the version in pyproject.toml first"; exit 1
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Test before publishing
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          QT_QPA_PLATFORM=offscreen pytest -q
      - name: Build the wheel and source archive (hash-locked tools)
        run: |
          python -m pip install --require-hashes -r requirements/build.lock
          python -m build --no-isolation --sdist --wheel --outdir dist
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then where=(--verify-tag); else where=(--target "$GITHUB_SHA"); fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" "${where[@]}" \
            --title "Foldward $VERSION" \
            --notes "Foldward $VERSION. What changed: CHANGELOG.md. Check downloads against SHA256SUMS.txt. Install: pip install \"foldward[gui] @ git+https://github.com/$GITHUB_REPOSITORY@$tag\""

  pypi:
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/foldward/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing: PyPI checks this workflow's identity, no token is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Upload only the wheel and the source archive
        run: rm dist/SHA256SUMS.txt && ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
