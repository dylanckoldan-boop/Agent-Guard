# Builds a release from a version tag (vX.Y.Z) and publishes it on GitHub with the SHA-256 of every file,
# so install commands can name an exact release instead of whatever main holds that minute (INT-06).
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The publish job runs in the `release` environment: add yourself as a required reviewer there
# (Settings -> Environments -> release) so nothing is published without your approval.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $v"; exit 1; }
      - name: Test before publishing
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          QT_QPA_PLATFORM=offscreen pytest -q
      - name: Build the wheel and source archive (hash-locked tools)
        run: |
          python -m pip install --require-hashes -r requirements/build.lock
          python -m build --no-isolation --sdist --wheel --outdir dist
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Foldward $version" \
            --notes "Foldward $version. What changed: CHANGELOG.md. Check downloads against SHA256SUMS.txt. Install: pip install \"foldward[gui] @ git+https://github.com/$GITHUB_REPOSITORY@$GITHUB_REF_NAME\""
