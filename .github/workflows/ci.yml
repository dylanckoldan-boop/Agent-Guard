name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: System libraries for offscreen Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install
        run: pip install -e ".[dev,gui]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      # Advisory supply-chain scan: surfaces known CVEs in the dependency tree
      # without blocking the build on a freshly disclosed, not-yet-actionable one.
      - name: Dependency vulnerability audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --desc
