name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: System libraries for offscreen Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      # Every dependency comes from the hash-locked file: a changed or substituted package fails the install (AG-A10).
      - name: Install (hash-locked)
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint (including the flake8-bandit security rules)
        run: ruff check src tests
      - name: Test
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      # Fails the build when a locked dependency has a known vulnerability. If one has no fix yet, add
      # `--ignore-vuln <ID>` here with a comment saying why and until when.
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --require-hashes -r requirements/audit.lock
          pip-audit --strict -r requirements/ci.lock --require-hashes --disable-pip --desc
