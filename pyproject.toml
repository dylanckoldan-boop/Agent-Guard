[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foldward"
version = "0.2.0"
description = "A containment net for autonomous AI agents — detect rogue agent activity and pacify it, reversibly, within your own perimeter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dylan C. Koldan" }]
keywords = ["ai-agents", "agent-security", "containment", "post-quantum", "oversight", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# The core is intentionally lean. Neither partner (sentinel-vision,
# cryptomigrate) appears here — not as a dependency, not as an optional extra.
dependencies = [
    "psutil>=5.9",
    "cryptography>=47.0",  # 47 is the first release with ML-DSA (post-quantum signing)
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
foldward-cli = "foldward.cli:main"

[project.gui-scripts]
foldward = "foldward.gui.app:main"

# Route B seam: when sentinel-vision is installed alongside Foldward, its
# plugin host discovers this entry point and Foldward's pages appear as a tab
# inside sentinel-vision — with no dependency in either direction. Harmless when
# sentinel-vision is absent (nothing reads the group).
[project.entry-points."sentinel_vision.plugins"]
foldward = "foldward.gui.plugin:register"

[project.urls]
Homepage = "https://github.com/dylanckoldan-boop/Foldward"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 118
target-version = "py310"

[tool.ruff.lint]
# High-signal families, including the flake8-bandit security rules (S, AG-A10).
# Broad `except` (BLE), try/except/pass and try/except/continue (S110, S112) are
# deliberate in the adapters, which must degrade gracefully and never crash the host;
# failures that matter (a containment record not copied, a refused quarantine) are
# reported explicitly instead.
select = ["E", "F", "I", "UP", "RUF", "S"]
# Long lines are almost all inline GUI stylesheet / f-strings, kept readable in place.
ignore = ["E501", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
# tests use assert, spawn helper processes and write temp files on purpose
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607"]
